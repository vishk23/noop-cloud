app = "vk-noop-cloud"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  # 1 GiB — same value as src/config.ts's default, deliberately. /ingest streams the body to the
  # volume and inflates it there, so this bounds DISK, not memory; MIN_FREE_BYTES + the per-request
  # preflight are what actually refuse an upload the volume cannot hold today.
  MAX_INGEST_BYTES = "1073741824"

[[mounts]]
  source = "noop_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Service-level check: gates deploys and routing (a top-level [checks] block is monitoring-only).
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
