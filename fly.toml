app = "noop-cloud"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[[mounts]]
  source = "noop_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Service-level check: gates deploys and routing (a top-level [checks] block is monitoring-only).
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
